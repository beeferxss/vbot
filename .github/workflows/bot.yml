name: Bot

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vbot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      # Cloudflare WARP is what changes the bot's address when a server filters
      # it. It is installed on every run rather than behind a repository
      # variable: the old gate needed one that was never set, so every run went
      # without it and nothing said so. If the install cannot be done the job
      # carries on - the bot just has no address to change - and the step shows
      # as failed, which is where a real problem belongs.
      - name: Install Cloudflare WARP
        id: warp
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          # A cold runner's apt mirrors are flaky; three tries before giving up.
          for attempt in 1 2 3; do
            sudo apt-get update -qq && break || sleep 5
          done
          sudo apt-get install -y cloudflare-warp

          sudo systemctl enable --now warp-svc || sudo service warp-svc start

          # The daemon runs as root and so must the calls that talk to it.
          sudo warp-cli --accept-tos registration new || echo "already registered"
          sudo warp-cli --accept-tos connect

          status=""
          for attempt in $(seq 1 20); do
            status="$(sudo warp-cli --accept-tos status 2>&1 || true)"
            case "$status" in
              *Connected*) break ;;
            esac
            sleep 2
          done
          echo "$status"

          # `warp=on` in the trace proves the runner's traffic goes through it.
          curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace \
            | grep -E '^(ip|warp)=' || true

          case "$status" in
            *Connected*) echo "ready=1" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "WARP did not come up, the bot runs without it"
              exit 1
              ;;
          esac

      - name: Generate configuration
        id: config
        env:
          BOT_OWNER_KEY: ${{ secrets.BOT_OWNER_KEY }}
          BOT_ADMIN_KEY: ${{ secrets.BOT_ADMIN_KEY }}
          BOT_TRUSTED_KEY: ${{ secrets.BOT_TRUSTED_KEY }}
          BOT_PREFIXES: ${{ vars.VBOT_PREFIXES }}
          # Only what the install step above actually managed to bring up.
          VBOT_WARP: ${{ steps.warp.outputs.ready }}
          VBOT_WARP_SUDO: ${{ steps.warp.outputs.ready == '1' }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -f config.example.json
          node scripts/make-config.js

      - name: Run bot with automatic crash recovery
        shell: bash
        env:
          # Six hours per session: the job timeout is 360 minutes, so the window
          # stops a little short to leave room for persisting the data and
          # starting the next run.
          RUN_WINDOW_SECONDS: ${{ vars.VBOT_RUN_WINDOW_SECONDS || '20700' }}
        run: |
          set -euo pipefail

          RESTART_DELAY=10
          deadline=$((SECONDS + RUN_WINDOW_SECONDS))
          LOG=/tmp/vbot.log

          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            started=$SECONDS

            # The bot's output never reaches the workflow log: it carries server
            # chat, player names and addresses, and this log is public. Only how
            # the session ended is printed, and the file is emptied for the next
            # session so nothing piles up on the runner.
            set +e
            timeout \
              --signal=INT \
              --kill-after=15s \
              "${remaining}s" \
              node src/index.js > "$LOG" 2>&1
            status=$?
            set -e

            : > "$LOG"
            echo "session ended after $((SECONDS - started))s (exit ${status})"

            if (( SECONDS >= deadline )); then
              break
            fi

            echo "bot exited, restarting in ${RESTART_DELAY}s"
            sleep "$RESTART_DELAY"
          done

      # Skipped when no server is enabled, so a misconfigured run does not
      # chain itself into an endless loop of pointless sessions.
      - name: Commit and push bot data
        id: persist
        if: always() && steps.config.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node scripts/checkpoint.js

          git remote set-url origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"

          git rm -r --cached --ignore-unmatch -- config.json node_modules

          git add -A

          if git diff --cached --quiet; then
            echo "no data changes to persist"
            exit 0
          fi

          git -c core.hooksPath=/dev/null commit \
            -m "chore: persist bot data"

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          git -c http.extraheader="$AUTH_HEADER" \
            push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Automatically start next session
        if: steps.persist.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '[.workflows[] | select(.name == "Bot" and .state == "active")] | first | .id')"

          if [[ -z "$WORKFLOW_ID" || "$WORKFLOW_ID" == "null" ]]; then
            exit 1
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
