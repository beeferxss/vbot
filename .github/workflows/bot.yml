name: Bot

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vbot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      # The bot's traffic goes through Cloudflare WARP, which warproxy runs as a
      # local SOCKS5 proxy - an npm dependency, so nothing needs installing and
      # nothing needs root. Started here so the engine and the WARP account are
      # ready before the first connection; the bot starts it itself if this fails.
      - name: Start the WARP proxy
        id: warp
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install warproxy start --detach --no-update-check
          npx --no-install warproxy status
          npx --no-install warproxy test
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Generate configuration
        id: config
        env:
          BOT_OWNER_KEY: ${{ secrets.BOT_OWNER_KEY }}
          BOT_ADMIN_KEY: ${{ secrets.BOT_ADMIN_KEY }}
          BOT_TRUSTED_KEY: ${{ secrets.BOT_TRUSTED_KEY }}
          BOT_PREFIXES: ${{ vars.VBOT_PREFIXES }}
          # On: the bot goes through the proxy, and connects directly only if it
          # cannot be brought up.
          VBOT_WARP: 'true'
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -f config.example.json
          node scripts/make-config.js

      # One session per job, up to the window below. A crash ends the run instead
      # of being restarted on top of whatever went wrong, and the `stop` command
      # exits with 42, which is the signal that no new session should start. The
      # bot's output goes to this log: it logs at error level with chat off, and
      # its proxy line says whether the connection went through WARP.
      - name: Run bot
        id: run
        shell: bash
        env:
          # A little short of the job timeout, so the data is saved and pushed
          # before the runner stops the job.
          RUN_WINDOW_SECONDS: ${{ vars.VBOT_RUN_WINDOW_SECONDS || '20700' }}
        run: |
          set -uo pipefail

          set +e
          timeout --signal=INT --kill-after=30s "${RUN_WINDOW_SECONDS}s" node src/index.js
          status=$?
          set -e

          echo "session ended (exit ${status})"
          echo "exit=${status}" >> "$GITHUB_OUTPUT"

          case "$status" in
            0|124)
              # On its own, or the window ran out: the next session starts.
              ;;
            42)
              echo "the stop command was used; no new session will start"
              echo "stop=1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "the bot exited with ${status}; no new session will start"
              exit "$status"
              ;;
          esac

      # Skipped when no server is enabled, so a misconfigured run does not
      # chain itself into an endless loop of pointless sessions.
      - name: Commit and push bot data
        id: persist
        if: always() && steps.config.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node scripts/checkpoint.js

          git remote set-url origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"

          git rm -r --cached --ignore-unmatch -- config.json node_modules

          git add -A

          if git diff --cached --quiet; then
            echo "no data changes to persist"
            exit 0
          fi

          git -c core.hooksPath=/dev/null commit \
            -m "chore: persist bot data"

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          # The branch can move between the checkout and this push - another
          # session's data commit, or a config change pushed while the bot ran.
          # Rebase this run's commit onto whatever is there now and try again,
          # so a rejected push does not throw the session's data away.
          for attempt in 1 2 3; do
            if git -c http.extraheader="$AUTH_HEADER" \
              push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "push rejected (attempt ${attempt}); rebasing onto ${GITHUB_REF_NAME}"

            if ! git fetch --no-tags origin "${GITHUB_REF_NAME}"; then
              echo "fetch failed; the data is committed locally but not pushed"
              exit 1
            fi

            if ! git -c core.hooksPath=/dev/null rebase FETCH_HEAD; then
              # The data files are binary and this run's copy is the current
              # state, so keep it for the files that conflict and take the rest
              # of the branch as it is.
              echo "rebase conflicted; merging with this run's data winning conflicts"
              git rebase --abort || true
              git -c core.hooksPath=/dev/null merge -X ours --no-edit FETCH_HEAD
            fi
          done

          echo "could not push the data after 3 attempts"
          exit 1

      - name: Automatically start next session
        if: always() && steps.run.outcome == 'success' && steps.persist.outcome == 'success' && steps.run.outputs.stop != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '[.workflows[] | select(.name == "Bot" and .state == "active")] | first | .id')"

          if [[ -z "$WORKFLOW_ID" || "$WORKFLOW_ID" == "null" ]]; then
            exit 1
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
